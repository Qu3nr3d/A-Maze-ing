[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generation and solving algorithms"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "jziental" },
    { name = "kgirczyc" },
]
dependencies = []

[project.optional-dependencies]
visual = ["mlx"]

[project.scripts]
maze-visual = "mazegen.visual:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "mlx",
]

[tool.uv.sources]
mlx = { path = "mlx-2.2-py3-none-any.whl" }
